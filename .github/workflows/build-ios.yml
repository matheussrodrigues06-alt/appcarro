name: Build iOS (IPA sem assinatura)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Compilar
        run: |
          xcodebuild \
            -project CarroGastos.xcodeproj \
            -target CarroGastos \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Gerar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarroGastos.app Payload/
          zip -qr CarroGastos.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarroGastos-ipa
          path: CarroGastos.ipa
