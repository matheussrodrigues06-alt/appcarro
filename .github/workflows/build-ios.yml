name: Build iOS (IPA sem assinatura)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # Roda em dois tipos de Mac ao mesmo tempo: basta um terminar para ter o .ipa.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versão do Xcode
        run: xcodebuild -version

      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild \
            -project CarroGastos.xcodeproj \
            -target CarroGastos \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          test -d build/Release-iphoneos/CarroGastos.app

      - name: Erros de compilação
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -50 || true

      - name: Gerar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/CarroGastos.app Payload/
          zip -qr CarroGastos.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarroGastos-ipa-${{ matrix.runner }}
          path: CarroGastos.ipa
