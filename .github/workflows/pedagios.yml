name: Pedágios (ANTT) e municípios (IBGE)

# Roda de graça em máquina Linux, uma vez por mês: gera data/pedagios.json
# (praças federais com valor aproximado para carro) e data/municipios.json
# (todas as cidades do Brasil). Se algum site estiver fora do ar, mantém os dados anteriores.
on:
  schedule:
    - cron: '41 9 3 * *'   # dia 3 de cada mês, 06:41 (Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/pedagios_municipios.py'
      - '.github/workflows/pedagios.yml'

permissions:
  contents: write

# Um de cada vez (evita dois robôs salvando o mesmo arquivo ao mesmo tempo).
concurrency:
  group: pedagios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e montar os dados
        run: python3 .github/scripts/pedagios_municipios.py

      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/pedagios.json data/municipios.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Atualiza pedágios e municípios [skip ci]"
          git pull --rebase -X theirs
          git push
