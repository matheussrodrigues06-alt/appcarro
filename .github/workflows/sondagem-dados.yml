name: Sondagem de dados (pedágio e municípios)
on:
  push:
    branches: [dados-teste]
  workflow_dispatch:
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/pedagios_municipios.py
      - run: ls -la data && head -c 1500 data/pedagios.json
